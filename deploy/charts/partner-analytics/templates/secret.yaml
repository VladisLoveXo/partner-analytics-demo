# In production these come from a secret manager (External Secrets, Vault), not from values.
apiVersion: v1
kind: Secret
metadata:
  name: partner-analytics
  labels:
    {{- include "pa.labels" (dict "name" "partner-analytics" "root" .) | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.postgres.url | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  GENERATOR_CLIENT_SECRET: {{ .Values.generator.clientSecret | quote }}
