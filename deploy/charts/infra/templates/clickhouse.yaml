{{- $ctx := dict "name" "clickhouse" "root" . }}
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    {{- include "infra.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "infra.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    {{- include "infra.labels" $ctx | nindent 4 }}
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "infra.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infra.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.clickhouse.password | quote }}
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
