{{- $ctx := dict "name" "redis" "root" . }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "infra.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "infra.selector" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Rate-limit counters and cache only: losing them on restart is acceptable, so no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "infra.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "infra.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infra.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
