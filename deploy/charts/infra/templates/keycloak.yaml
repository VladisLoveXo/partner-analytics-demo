{{- $ctx := dict "name" "keycloak" "root" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "infra.labels" $ctx | nindent 4 }}
data:
  realm-partners.json: |-
{{ required "pass the realm: --set-file keycloak.realm=infra/keycloak/realm-partners.json" .Values.keycloak.realm | indent 4 }}
---
# NodePort, mapped to localhost:8180 by the kind config: the browser and the pods
# must see the same issuer URL in tokens.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "infra.labels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "infra.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.keycloak.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "infra.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "infra.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infra.labels" $ctx | nindent 8 }}
      annotations:
        checksum/realm: {{ .Values.keycloak.realm | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          # start-dev: embedded database, realm imported on every start. Fine for a demo, not for production.
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.keycloak.adminPassword | quote }}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            # Pods call keycloak.infra.svc:8080 directly; the issuer in tokens stays the public URL.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
