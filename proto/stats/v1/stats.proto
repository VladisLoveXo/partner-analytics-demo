syntax = "proto3";

package stats.v1;

import "google/protobuf/timestamp.proto";

// StatsService stores partner traffic events and serves per-partner aggregates.
service StatsService {
  // IngestEvents stores a batch of events.
  // Callers must send an `idempotency-key` header. A retried batch with the same key
  // is stored once, which makes the call safe to retry.
  rpc IngestEvents(IngestEventsRequest) returns (IngestEventsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetPartnerDaily returns one row per day of the range, zero-filled for days without events.
  rpc GetPartnerDaily(GetPartnerDailyRequest) returns (GetPartnerDailyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListPartnerTotals returns totals per partner over the range, highest revenue first.
  rpc ListPartnerTotals(ListPartnerTotalsRequest) returns (ListPartnerTotalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// EventType is the kind of a partner traffic event.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_CLICK = 1;
  EVENT_TYPE_CONVERSION = 2;
}

// Event is a single click or conversion attributed to a partner.
message Event {
  // UUID generated by the producer. Every delivery of the same event carries the same id.
  string event_id = 1;
  string partner_id = 2;
  EventType type = 3;
  google.protobuf.Timestamp occurred_at = 4;
  // Conversion amount in minor currency units (kopecks). Always 0 for clicks.
  int64 revenue_minor = 5;
  // Partner's own traffic tag, for example a campaign or a placement.
  string sub_id = 6;
}

message IngestEventsRequest {
  repeated Event events = 1;
}

message IngestEventsResponse {
  // Number of events stored, or recognised as a repeat of an already stored batch.
  uint32 accepted = 1;
}

message GetPartnerDailyRequest {
  string partner_id = 1;
  // Inclusive UTC date range, YYYY-MM-DD.
  string from = 2;
  string to = 3;
}

message DailyStats {
  // UTC date, YYYY-MM-DD.
  string date = 1;
  uint64 clicks = 2;
  uint64 conversions = 3;
  int64 revenue_minor = 4;
}

message GetPartnerDailyResponse {
  repeated DailyStats days = 1;
}

message ListPartnerTotalsRequest {
  // Inclusive UTC date range, YYYY-MM-DD.
  string from = 1;
  string to = 2;
}

message PartnerTotals {
  string partner_id = 1;
  uint64 clicks = 2;
  uint64 conversions = 3;
  int64 revenue_minor = 4;
}

message ListPartnerTotalsResponse {
  repeated PartnerTotals partners = 1;
}
